# nginx vhost для Control Plane на VPS (144.31.61.208)
#
# Устанавливать ПОСЛЕ появления A-записей api./control. и выпуска сертификата:
#   install -m 0644 nginx-ai-platform.conf /etc/nginx/sites-available/ai-platform
#   ln -s /etc/nginx/sites-available/ai-platform /etc/nginx/sites-enabled/ai-platform
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.nshno.tech -d control.nshno.tech
#
# Не затрагивает существующие сайты: nshno-root слушает 80 как default_server,
# этот блок срабатывает только на свои server_name.

server {
    listen 80;
    listen [::]:80;
    server_name api.nshno.tech control.nshno.tech;

    access_log /var/log/nginx/ai-platform.access.log;
    error_log  /var/log/nginx/ai-platform.error.log;

    # Лимит запроса: вложения проектов позже пойдут через Object Storage,
    # здесь остаётся только JSON чата и служебные вызовы.
    client_max_body_size 16m;

    # Туннель шард-группы. Лимит тела снят, буферизация тела выключена:
    # иначе деплой этого файла обрежет поток, который на сервере уже открыт.
    location /worker/v1/mesh/link {
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Сборки программы участника. Манифест не кэшируется.
    location /node/ {
        alias /opt/compute-control/node/;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8090/health;
        access_log off;
    }
}
