# nginx vhost для Control Plane на VPS (144.31.61.208).
#
# Два имени, один сертификат:
#   api.nshno.tech     — только API (клиенты, worker-agent, внешние SDK);
#   control.nshno.tech — веб-панель (статика) и её же /api/* на тот же gateway.
#
# Порядок установки:
#   install -m 0644 nginx-ai-platform.conf /etc/nginx/sites-available/ai-platform
#   ln -s /etc/nginx/sites-available/ai-platform /etc/nginx/sites-enabled/ai-platform
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.nshno.tech -d control.nshno.tech
#
# Чужие сайты не затрагиваются: nshno-root слушает 80 как default_server, эти
# блоки срабатывают только на свои server_name.

# ---------- API ----------

server {
    server_name api.nshno.tech;

    access_log /var/log/nginx/ai-platform.access.log;
    error_log  /var/log/nginx/ai-platform.error.log;

    # Вложения проектов позже пойдут через объектное хранилище, здесь остаются
    # только JSON чата и служебные вызовы.
    client_max_body_size 16m;

    # Туннель шард-группы: тело заранее неизвестного размера. Общий лимит 16m
    # обрывает поток тензоров на середине.
    location /worker/v1/mesh/link {
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Ответ модели приходит потоком: буферизация выключена, иначе токены
        # копятся в nginx и пользователь видит ответ целиком, а не по мере генерации.
        proxy_buffering off;
        proxy_cache off;
        # Узел отправляет чанки телом запроса по мере генерации: если nginx
        # начнёт буферизовать тело, весь ответ соберётся до отправки.
        proxy_request_buffering off;
        # Ответ модели и приём чанков от узла — долгие потоки: полчаса
        # запаса, иначе длинная генерация обрывается на середине.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.nshno.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.nshno.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ---------- веб-панель ----------

server {
    server_name control.nshno.tech;

    root /opt/compute-control/web;
    index index.html;

    access_log /var/log/nginx/ai-platform.access.log;
    error_log  /var/log/nginx/ai-platform.error.log;

    # Панель обращается к API по тому же origin, поэтому CORS не нужен,
    # а токен администратора не покидает этот домен.
    location /api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты собираются с хешем в имени: их можно кешировать надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.nshno.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.nshno.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = control.nshno.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = api.nshno.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.nshno.tech control.nshno.tech;
    return 404; # managed by Certbot

}
